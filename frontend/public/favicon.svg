<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="shieldGrad" x1="8" y1="4" x2="56" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="32" y1="8" x2="32" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
  </defs>

  <!-- Outer Protective Shield -->
  <path d="M32 4 C48 10 56 13 56 26 C56 42 44 54 32 60 C20 54 8 42 8 26 C8 13 16 10 32 4 Z" 
        fill="url(#shieldGrad)" />
  
  <!-- Inner Shield Trim -->
  <path d="M32 8 C44 13 52 15 52 27 C52 40 41 50 32 55 C23 50 12 40 12 27 C12 15 20 13 32 8 Z" 
        stroke="url(#glowGrad)" stroke-width="2" stroke-opacity="0.8" fill="none" />

  <!-- Medical Cross / Healthcare Emblem (Translucent White) -->
  <rect x="29" y="19" width="6" height="22" rx="2" fill="#FFFFFF" fill-opacity="0.25" />
  <rect x="21" y="27" width="22" height="6" rx="2" fill="#FFFFFF" fill-opacity="0.25" />

  <!-- Shield Verification Checkmark -->
  <path d="M22 32 L29 39 L43 23" 
        stroke="#10B981" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M22 32 L29 39 L43 23" 
        stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
</svg>

