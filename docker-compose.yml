version: "3.8"

services:
  # PostgreSQL database with pgvector extension support
  postgres:
    image: pgvector/pgvector:pg16
    container_name: hospital_auditor_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-hospital_auditor}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # FastAPI Backend Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hospital_auditor_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=development
      - DEBUG=true
      - DEMO_MODE=true
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/hospital_auditor
      - ENABLE_PGVECTOR=true
      - STORAGE_PROVIDER=local
      - OCR_PROVIDER=mock
      - LLM_PROVIDER=mock
    volumes:
      - ./backend:/app
      - ./documents:/documents
      - ./rules:/rules
    depends_on:
      postgres:
        condition: service_healthy

  # Next.js Frontend Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: hospital_auditor_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_BASE_URL=http://localhost:8000/api/v1
      - NEXT_PUBLIC_DEMO_MODE=true
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend

volumes:
  postgres_data:
